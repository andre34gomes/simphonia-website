name: Quality Gate

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ── Job 1: Syntax & Static Checks ───────────────────────────────────────────
  lint:
    name: Syntax & Static Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check JS syntax (all files)
        run: |
          echo "Checking syntax of all JS files..."
          find js -name "*.js" -print0 | xargs -0 -I{} node --check {}
          find scripts -name "*.js" -print0 | xargs -0 -I{} node --check {}
          find tests -name "*.js" -print0 | xargs -0 -I{} node --check {}
          echo "All JS files passed syntax check."

      - name: Check route shells are in sync with index.html
        run: node scripts/sync-shells.js --check

      - name: Verify no unsafe-inline in script-src (meta CSP)
        run: |
          if grep -n "script-src.*unsafe-inline" index.html; then
            echo "ERROR: index.html meta CSP has 'unsafe-inline' in script-src"
            echo "This weakens XSS protection. Remove it and use nonces if needed."
            exit 1
          fi
          echo "CSP check passed — no unsafe-inline in script-src."

      - name: Verify server-level security headers are consistent
        run: |
          # Both vercel.json and netlify.toml must define X-Frame-Options
          if ! grep -q "X-Frame-Options" vercel.json; then
            echo "ERROR: vercel.json is missing X-Frame-Options header"
            exit 1
          fi
          if ! grep -q "X-Frame-Options" netlify.toml; then
            echo "ERROR: netlify.toml is missing X-Frame-Options header"
            exit 1
          fi
          echo "Security header check passed."

      - name: Verify service worker covers all CSS files
        run: |
          node -e "
            const fs = require('fs');
            const sw = fs.readFileSync('sw.js', 'utf8');
            const cssFiles = fs.readdirSync('css').filter(f => f.endsWith('.css'));
            let missing = 0;
            cssFiles.forEach(f => {
              const name = f.replace(/(\?.*)?$/, '');
              if (!sw.includes('/css/' + name)) {
                console.error('MISSING from sw.js PRECACHE_URLS: /css/' + name);
                missing++;
              }
            });
            if (missing > 0) process.exit(1);
            console.log('Service worker CSS coverage check passed (' + cssFiles.length + ' files).');
          "

  # ── Job 2: Test Suite ────────────────────────────────────────────────────────
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run tests
        run: node --test tests/*.test.js

  # ── Job 3: i18n Completeness ─────────────────────────────────────────────────
  i18n:
    name: i18n Completeness
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check all locale files have the same top-level keys as en.json
        run: |
          node -e "
            const fs = require('fs');
            const path = require('path');
            const i18nDir = path.join('js', 'i18n');
            const en = JSON.parse(fs.readFileSync(path.join(i18nDir, 'en.json'), 'utf8'));
            const enKeys = Object.keys(en).sort().join(',');
            const locales = fs.readdirSync(i18nDir).filter(f => f.endsWith('.json') && f !== 'en.json');
            let failed = 0;
            locales.forEach(locale => {
              const data = JSON.parse(fs.readFileSync(path.join(i18nDir, locale), 'utf8'));
              const keys = Object.keys(data).sort().join(',');
              if (keys !== enKeys) {
                const missing = Object.keys(en).filter(k => !data[k]);
                const extra = Object.keys(data).filter(k => !en[k]);
                if (missing.length) console.error(locale + ': missing top-level keys: ' + missing.join(', '));
                if (extra.length)   console.warn(locale + ': extra top-level keys: '   + extra.join(', '));
                if (missing.length) failed++;
              }
            });
            if (failed > 0) {
              console.error(failed + ' locale(s) have missing keys.');
              process.exit(1);
            }
            console.log('i18n check passed — all ' + locales.length + ' locales have required top-level keys.');
          "

  # ── Cloudflare Pages handles deployment automatically on push ────────────────
  # No deploy step needed here — Cloudflare watches the repo directly.
