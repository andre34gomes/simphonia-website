          <h1 class="reveal"><span>Privacy</span><br><span class="text-gradient">Policy</span></h1>

      <section class="section section--compact-top">
        <div class="container"><div class="legal-layout"><div class="legal-prose">
          <p>At Simphonia (&quot;we&quot;, &quot;us&quot;, &quot;our&quot;), we are committed to protecting your privacy in accordance with the General Data Protection Regulation (GDPR), the Portuguese Data Protection Law, and other applicable data protection legislation. This Privacy Policy explains how we collect, use, disclose, and safeguard your information when you use our mobile application and website (collectively, the &quot;Service&quot;).</p>
    <h2 id="info-collect">1. Information We Collect</h2><h3>1.1 Account Information</h3><p>When you create an account or make a purchase, we collect:</p><ul><li>Full name and email address</li><li>Password (stored in securely hashed form — we never store or have access to your plain-text password)</li><li>Profile photo (if provided via social login)</li><li>Account preferences: language, currency, and theme settings</li></ul><h3>1.2 Social Login Data</h3><p>If you sign in or register using a third-party provider (Google, Facebook, or Apple), we receive the following information from that provider:</p><ul><li>Name and email address associated with your social account</li><li>Profile photo URL</li><li>A unique provider identifier to link your social account</li></ul><p>We do not receive or store your social media passwords. Authentication tokens from social providers are used only during the login process and for identity verification.</p><h3>1.3 Purchase &amp; Billing Information</h3><p>When you make a purchase, we collect:</p><ul><li>Email address for order confirmation and eSIM delivery</li><li>Billing country (for tax and compliance purposes)</li><li>Phone number (optional, if provided at checkout)</li><li>Order details: plans purchased, quantities, prices, currency, and discount codes applied</li></ul><p>Payment card details (card number, expiry, CVC) are collected and processed exclusively by our payment processor, Stripe. We never receive or store your full payment card information on our servers.</p><h3>1.4 Usage Data</h3><p>We automatically collect certain information when you use the Service:</p><ul><li>Device information: model, operating system, screen size, and eSIM compatibility</li><li>App version and build number</li><li>Feature interactions and navigation patterns</li><li>IP address</li><li>General location data at country/region level (derived from IP address — we do not use GPS or precise location tracking)</li><li>Timestamp of actions (e.g. login, purchase, chat)</li></ul><h3>1.5 Crash Reports &amp; Performance Data</h3><p>We use Sentry, a third-party error monitoring service, to collect crash reports and performance diagnostics in production. This data includes stack traces, device metadata, and app state at the time of the error. Personal identifiers (PII) are automatically scrubbed before transmission. Crash reporting is disabled in development environments.</p><h3>1.6 Support &amp; Chat Interactions</h3><p>When you use the AI chat assistant or submit a support ticket, we collect:</p><ul><li>The content of your chat messages and support requests</li><li>Feedback you provide on AI responses (thumbs up/down)</li><li>Support ticket subject, message body, and status updates</li></ul><p>Chat messages are sent to third-party AI providers (OpenAI and/or Google Gemini) for response generation. We do not send your password, payment details, or other sensitive account data to AI providers. The following information is shared with AI providers to generate relevant, personalized responses: conversation text, your preferred language and currency, your first name, authentication status, and — when you request account-related assistance — data retrieved on your behalf such as order details, eSIM status, and referral information.</p><h3>1.7 Referral Program Data</h3><p>If you participate in our referral program, we collect and process your referral code, the number of successful referrals, and earned reward codes. This information is linked to your account email address.</p><h3>1.8 On-Device Storage</h3><p>The app stores certain data locally on your device for functionality and convenience:</p><ul><li>Authentication tokens stored in secure device storage (iOS Keychain / Android Keystore)</li><li>App preferences (theme, language, currency) stored in local storage</li><li>Shopping cart contents stored locally</li><li>Favorite destinations stored locally and synced to our servers when you are logged in</li></ul><p>This data remains on your device and is not transmitted to our servers unless required for functionality (e.g., syncing favorites to your account when logged in).</p>
    <h2 id="legal-basis">2. Legal Basis for Processing (GDPR)</h2><p>Under the GDPR, we process your personal data based on the following legal grounds:</p><ul><li>Contract performance (Art. 6(1)(b)): Processing necessary to provide the Service, fulfill eSIM orders, manage your account, and process payments</li><li>Legitimate interests (Art. 6(1)(f)): Fraud prevention, security monitoring, service improvement, analytics, and customer support</li><li>Consent (Art. 6(1)(a)): Marketing communications (you can withdraw consent at any time), and where AI chat messages are processed by third-party providers</li><li>Legal obligation (Art. 6(1)(c)): Tax compliance, financial record-keeping, and responding to lawful requests from authorities</li></ul>
    <h2 id="how-we-use">3. How We Use Your Information</h2><p>We use the collected information for the following purposes:</p><ul><li>To provide, maintain, and improve the Service</li><li>To create and manage your user account</li><li>To process transactions, deliver eSIM profiles, and send order confirmations</li><li>To verify your email address during registration</li><li>To enable password reset and account recovery</li><li>To provide customer support through AI chat and human agents</li><li>To process and respond to support tickets</li><li>To operate the referral program and deliver earned rewards</li><li>To send transactional communications (welcome emails, order confirmations, receipts, ticket updates, referral rewards)</li><li>To send marketing emails (only with your explicit opt-in consent)</li><li>To detect, prevent, and address fraud, abuse, and security issues</li><li>To monitor application performance and fix errors (via Sentry)</li><li>To analyze usage trends and improve user experience</li><li>To comply with legal obligations and enforce our Terms of Service</li></ul>
    <h2 id="data-sharing">4. Data Sharing &amp; Third Parties</h2><p>We do not sell, rent, or trade your personal information. We share data with third parties only as necessary to provide the Service:</p><ul><li>Airalo (eSIM provider): We share your email address and order details to provision and activate eSIM profiles. Airalo processes this data as a data processor on our behalf</li><li>Stripe (payment processor): Collects and processes your payment card details, billing email, and billing country. Stripe is PCI-DSS Level 1 certified. See Stripe&#39;s Privacy Policy at https://stripe.com/privacy</li><li>OpenAI and Google (AI providers): Chat conversation text, language preference, and currency are sent to generate AI responses. We do not send identifying personal data unless you include it in your messages. See OpenAI&#39;s Privacy Policy at https://openai.com/privacy and Google&#39;s Privacy Policy at https://policies.google.com/privacy</li><li>Sentry (error monitoring): Receives anonymized crash reports and performance data. PII is automatically scrubbed. See Sentry&#39;s Privacy Policy at https://sentry.io/privacy</li><li>Google, Facebook, Apple (social login providers): When you use social login, authentication data flows through these providers. We receive only name, email, and profile photo</li><li>Email delivery services: Transactional and marketing emails are sent through our email infrastructure</li><li>Legal authorities: We may disclose data when required by law, court order, or to protect our rights, safety, or property</li></ul>
    <h2 id="data-security">5. Data Security</h2><p>We implement comprehensive security measures to protect your information:</p><ul><li>All data in transit is encrypted using TLS (Transport Layer Security)</li><li>Passwords are hashed using industry-standard algorithms (bcrypt) — we never store plain-text passwords</li><li>Authentication tokens are stored in secure device storage (iOS Keychain / Android Keystore)</li><li>JWT-based authentication with automatic token rotation and expiration</li><li>API rate limiting and input sanitization to prevent abuse</li><li>Sensitive data fields are automatically scrubbed from error reports</li><li>Regular security audits and dependency vulnerability scanning</li></ul><p>While we strive to protect your data, no method of electronic transmission or storage is 100% secure. We cannot guarantee absolute security but are committed to continuous improvement of our security practices.</p>
    <h2 id="data-retention">6. Data Retention</h2><p>We retain your personal information as follows:</p><ul><li>Account data: Retained while your account is active. Deleted upon account deletion request, subject to legal retention obligations</li><li>Order and transaction records: Retained for a minimum of 7 years after the transaction date for tax and financial compliance purposes</li><li>Chat conversations: Retained for up to 12 months for service quality and support purposes</li><li>Support tickets: Retained for up to 24 months after resolution</li><li>Crash reports and performance data: Retained for up to 90 days</li><li>Marketing consent records: Retained for as long as the consent is valid, plus 3 years after withdrawal for compliance documentation</li></ul><p>You may request deletion of your account and associated data at any time through the Profile Settings page in the app or by contacting support@simphonia.pt. Upon deletion, your data will be removed from active systems within 30 days, except where retention is required by law.</p>
    <h2 id="your-rights">7. Your Rights (GDPR &amp; EU Law)</h2><p>Under the GDPR and applicable data protection laws, you have the following rights regarding your personal data:</p><ul><li>Right of access (Art. 15): Request a copy of the personal data we hold about you</li><li>Right to rectification (Art. 16): Request correction of inaccurate or incomplete data. You can update your name directly in the app</li><li>Right to erasure / right to be forgotten (Art. 17): Request deletion of your data. You can delete your account directly through the app&#39;s Profile Settings</li><li>Right to restriction of processing (Art. 18): Request that we limit how we use your data while a concern is being resolved</li><li>Right to data portability (Art. 20): Request a machine-readable copy of the data you have provided to us</li><li>Right to object (Art. 21): Object to processing based on legitimate interests, including for direct marketing purposes</li><li>Right to withdraw consent (Art. 7): You may withdraw consent for marketing emails at any time through the app or the unsubscribe link. Withdrawal does not affect the lawfulness of processing based on consent before its withdrawal</li></ul><p>To exercise any of these rights, contact us at support@simphonia.pt. We will respond to your request within 30 days, as required by the GDPR.</p><p>If you believe your data protection rights have been violated, you have the right to lodge a complaint with your national supervisory authority. In Portugal, the supervisory authority is the Comissão Nacional de Proteção de Dados (CNPD) at <a href="https://www.cnpd.pt" rel="noopener noreferrer">www.cnpd.pt</a>.</p>
    <h2 id="cookies">8. Cookies &amp; Local Storage</h2><p>Our website uses minimal, essential cookies and local storage for functionality, including:</p><ul><li>Theme preference (light/dark mode)</li><li>Language selection</li><li>Session management</li></ul><p>We do not use third-party advertising or tracking cookies. The mobile app uses on-device storage (SharedPreferences and secure storage) for preferences and authentication tokens as described in Section 1.8.</p>
    <h2 id="children">9. Children&#39;s Privacy</h2><p>The Service is not directed to children under 16 years of age. We do not knowingly collect personal information from children under 16. If we become aware that we have inadvertently collected data from a child under 16, we will take steps to delete that data as soon as possible. If you believe a child under 16 has provided us with personal data, please contact us at support@simphonia.pt.</p>
    <h2 id="transfers">10. International Data Transfers</h2><p>Your personal data is primarily processed within the European Economic Area (EEA). However, some of our third-party service providers may process data outside the EEA:</p><ul><li>Stripe (United States) — Payment processing, covered by Standard Contractual Clauses (SCCs) and Stripe&#39;s Data Processing Agreement</li><li>OpenAI (United States) — AI chat response generation, covered by SCCs and OpenAI&#39;s Data Processing Addendum</li><li>Google / Gemini (United States) — AI chat response generation and social login, covered by SCCs and Google&#39;s Data Processing Terms</li><li>Sentry (United States) — Error monitoring, covered by SCCs and Sentry&#39;s Data Processing Addendum</li><li>Airalo (varies) — eSIM provisioning and activation</li></ul><p>Where data is transferred outside the EEA, we ensure appropriate safeguards are in place as required by Article 46 of the GDPR, including Standard Contractual Clauses approved by the European Commission.</p>
    <h2 id="changes">11. Changes to This Policy</h2><p>We may update this Privacy Policy from time to time to reflect changes in our data practices, the Service, or applicable law. We will notify you of material changes by:</p><ul><li>Updating the &quot;Last updated&quot; date at the top of this page</li><li>Posting a notice on the website or in the app</li><li>Sending an email notification for significant changes (if you have an account)</li></ul><p>We encourage you to review this Privacy Policy periodically. Your continued use of the Service after changes take effect constitutes acceptance of the updated policy.</p>
    <h2 id="data-controller">12. Data Controller</h2><p>The data controller responsible for your personal data is:</p><ul><li>Simphonia</li><li>Lisbon, Portugal</li><li>Email: support@simphonia.pt</li></ul><p>For any data protection inquiries, you may contact us at the email address above.</p>
    <h2 id="privacy-contact">13. Contact Us</h2><p>If you have questions about this Privacy Policy, wish to exercise your data protection rights, or have concerns about how we handle your data, contact us at:</p><ul><li>Email: support@simphonia.pt</li><li>Website: https://simphonia.pt/support/</li></ul>
