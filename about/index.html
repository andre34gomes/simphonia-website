      <section class="section" id="story" aria-labelledby="story-heading">
        <div class="container"><div class="about-story reveal">
          <div class="about-story__img">
            <img src="https://images.unsplash.com/photo-1488646953014-85cb44e25828?auto=format&fit=crop&q=80&w=1000" alt="Traveler looking at a departure board" data-i18n-alt="imgAlt.travelerDeparture" width="1000" height="667" loading="lazy" decoding="async" fetchpriority="low">

          <div class="about-story__body">
            <span class="label" data-i18n="about.story.label">Our Story</span>
            <h2 id="story-heading"><span data-i18n="about.story.heading1">Born From a</span><br><span class="text-gradient" data-i18n="about.story.heading2">Travel Frustration</span></h2>
            <blockquote class="about-story__quote" data-i18n="about.story.quote">"I landed in Tokyo at midnight with zero mobile data. No maps, no ride, no translation. That one trip changed everything."</blockquote>
            <p data-i18n="about.story.p1">That frustration — the overpriced roaming, the hunt for local SIM cards, the confusing carrier shops — became the spark behind Simphonia.</p>
            <p data-i18n="about.story.p2">Founded in 2024, we set out to make global connectivity instant and accessible for every traveler. Today, Simphonia covers 200+ countries with one-tap eSIM activation, transparent pricing, and 24/7 AI-powered support.</p>
            <div class="about-story__stats">

            </div>

          <div class="values-grid">
            <div class="value-card glass-card reveal"><div class="value-card__icon">🌍</div><h3 data-i18n="about.values.v1Title">Global First</h3><p data-i18n="about.values.v1Desc">We think globally. Every feature, every plan, every decision is made with the world traveler in mind. Coverage without borders.</p></div>
            <div class="value-card glass-card reveal"><div class="value-card__icon">⚡</div><h3 data-i18n="about.values.v2Title">Instant Everything</h3><p data-i18n="about.values.v2Desc">Speed matters when you travel. From purchase to activation, everything happens in seconds. No waiting, no delays.</p></div>
            <div class="value-card glass-card reveal"><div class="value-card__icon">💎</div><h3 data-i18n="about.values.v3Title">Radical Transparency</h3><p data-i18n="about.values.v3Desc">No hidden fees, no surprise charges, no fine print. What you see is what you pay. We believe trust is built through honesty.</p></div>
            <div class="value-card glass-card reveal"><div class="value-card__icon">🤝</div><h3 data-i18n="about.values.v4Title">Traveler Obsessed</h3><p data-i18n="about.values.v4Desc">Every feature exists because a traveler needed it. We listen, iterate, and ship relentlessly to solve real travel pain points.</p></div>
