# ── Security Headers ─────────────────────────────────────────
# Applied to every response. Use the most restrictive settings
# compatible with site functionality.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options              = "DENY"
    X-Content-Type-Options       = "nosniff"
    X-XSS-Protection             = "1; mode=block"
    Referrer-Policy              = "strict-origin-when-cross-origin"
    Permissions-Policy           = "camera=(), microphone=(), geolocation=(), payment=(self)"
    Strict-Transport-Security    = "max-age=31536000; includeSubDomains; preload"
    # CSP: script-src allows self + cdnjs CDN. unsafe-inline is needed
    # for the theme-init script and stylesheet onload handlers.
    # style-src uses 'unsafe-inline' for dynamic class toggling and critical CSS.
    Content-Security-Policy      = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; style-src 'self' https://fonts.googleapis.com 'unsafe-inline'; font-src 'self' https://fonts.gstatic.com; img-src 'self' https://images.unsplash.com https://api.simphonia.pt https://flagcdn.com data: blob:; connect-src 'self' https://api.simphonia.pt; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests;"

# ── Redirects ─────────────────────────────────────────────────
[[redirects]]
  from = "/pages/destinations.html"
  to = "/destinations/"
  status = 301

[[redirects]]
  from = "/pages/how-it-works.html"
  to = "/how-it-works/"
  status = 301

[[redirects]]
  from = "/pages/support.html"
  to = "/support/"
  status = 301

[[redirects]]
  from = "/pages/about.html"
  to = "/about/"
  status = 301

[[redirects]]
  from = "/pages/privacy.html"
  to = "/privacy/"
  status = 301

[[redirects]]
  from = "/pages/terms.html"
  to = "/terms/"
  status = 301

# Custom 404 error page
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

# ── Cache Control ────────────────────────────────────────────
# Immutable static assets — long cache with revalidation
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# HTML pages — always revalidate for freshness
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Web App Manifest — short cache so updates are picked up quickly
[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"
    Content-Type = "application/manifest+json"


