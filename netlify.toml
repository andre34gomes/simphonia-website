# ── Security Headers ─────────────────────────────────────────
# Applied to every response. Use the most restrictive settings
# compatible with site functionality.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options              = "DENY"
    X-Content-Type-Options       = "nosniff"
    Referrer-Policy              = "strict-origin-when-cross-origin"
    Permissions-Policy           = "camera=(), microphone=(), geolocation=(), payment=(self)"
    Strict-Transport-Security    = "max-age=31536000; includeSubDomains; preload"
    Cross-Origin-Opener-Policy   = "same-origin"
    # CSP: script-src allows self + cdnjs CDN. unsafe-inline is needed
    # for the theme-init script and stylesheet onload handlers.
    # style-src uses 'unsafe-inline' for dynamic class toggling and critical CSS.
    Content-Security-Policy      = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; style-src 'self' https://fonts.googleapis.com 'unsafe-inline'; font-src 'self' https://fonts.gstatic.com; img-src 'self' https://images.unsplash.com https://api.simphonia.pt http://localhost:* https://flagcdn.com data: blob:; connect-src 'self' https://api.simphonia.pt http://localhost:*; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests;"

# ── Redirects ─────────────────────────────────────────────────
# IMPORTANT: keep `/pages/*` fetchable as-is. The SPA router loads those HTML
# fragments directly, so redirecting `/pages/*.html` to clean URLs breaks
# in-app navigation and causes the app to fall back to home.
#
# Known clean URLs are served by their real route shells (`/about/index.html`,
# `/support/index.html`, etc.). Unknown routes should fall through to the host's
# native `404.html` handling instead of being rewritten to the SPA shell.
[[redirects]]
  from = "/pages/*"
  to = "/pages/:splat"
  status = 200

[[redirects]]
  from = "/404.html"
  to = "/404.html"
  status = 200

# ── Cache Control ────────────────────────────────────────────
# Immutable static assets — long cache with revalidation
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# HTML pages — always revalidate for freshness
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Web App Manifest — short cache so updates are picked up quickly
[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"
    Content-Type = "application/manifest+json"


