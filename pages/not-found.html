<div data-page="not-found">
  <section class="error-section" aria-labelledby="error-title-heading">
    <div class="error-orb" style="width:720px;height:720px;background:rgba(212,175,55,0.07);top:-22%;left:-18%;filter:blur(170px);"></div>
    <div class="error-orb" style="width:520px;height:520px;background:rgba(80,50,210,0.05);bottom:-18%;right:-14%;filter:blur(150px);"></div>
    <div class="error-orb" style="width:340px;height:340px;background:rgba(212,175,55,0.04);top:40%;left:48%;transform:translateX(-50%);filter:blur(110px);"></div>

    <svg class="cloud cloud--1" width="260" height="100" viewBox="0 0 260 100" aria-hidden="true" focusable="false">
      <ellipse cx="130" cy="68" rx="105" ry="28" fill="currentColor"></ellipse>
      <ellipse cx="90" cy="54" rx="65" ry="34" fill="currentColor"></ellipse>
      <ellipse cx="168" cy="56" rx="58" ry="30" fill="currentColor"></ellipse>
      <ellipse cx="130" cy="48" rx="48" ry="26" fill="currentColor"></ellipse>
    </svg>
    <svg class="cloud cloud--2" width="320" height="110" viewBox="0 0 320 110" aria-hidden="true" focusable="false">
      <ellipse cx="160" cy="76" rx="128" ry="30" fill="currentColor"></ellipse>
      <ellipse cx="110" cy="60" rx="78" ry="38" fill="currentColor"></ellipse>
      <ellipse cx="210" cy="62" rx="72" ry="32" fill="currentColor"></ellipse>
      <ellipse cx="160" cy="54" rx="58" ry="28" fill="currentColor"></ellipse>
    </svg>
    <svg class="cloud cloud--3" width="180" height="80" viewBox="0 0 180 80" aria-hidden="true" focusable="false">
      <ellipse cx="90" cy="56" rx="72" ry="22" fill="currentColor"></ellipse>
      <ellipse cx="62" cy="44" rx="44" ry="26" fill="currentColor"></ellipse>
      <ellipse cx="118" cy="46" rx="40" ry="22" fill="currentColor"></ellipse>
      <ellipse cx="90" cy="38" rx="34" ry="20" fill="currentColor"></ellipse>
    </svg>
    <svg class="cloud cloud--4" width="230" height="92" viewBox="0 0 230 92" aria-hidden="true" focusable="false">
      <ellipse cx="115" cy="64" rx="92" ry="25" fill="currentColor"></ellipse>
      <ellipse cx="80" cy="52" rx="56" ry="30" fill="currentColor"></ellipse>
      <ellipse cx="152" cy="54" rx="50" ry="26" fill="currentColor"></ellipse>
      <ellipse cx="115" cy="46" rx="42" ry="22" fill="currentColor"></ellipse>
    </svg>

    <div class="flight-track" aria-hidden="true" role="presentation">
      <svg class="flight-svg" viewBox="0 0 740 175" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path
          id="flightArc"
          class="flight-path"
          d="M 55,148 C 190,18 550,18 685,148"
          stroke="#D4AF37"
          stroke-width="1.6"
          stroke-dasharray="9 7"
          stroke-linecap="round"
          opacity="0.5"
        ></path>

        <circle class="pin-ring" cx="55" cy="148" r="9" fill="none" stroke="#D4AF37" stroke-width="1.5"></circle>
        <circle class="pin-ring pin-ring--b" cx="55" cy="148" r="9" fill="none" stroke="#D4AF37" stroke-width="1"></circle>
        <circle cx="55" cy="148" r="7" fill="#D4AF37"></circle>
        <path
          d="M55 144.5 L51 148 L52.5 148 L52.5 151.5 L57.5 151.5 L57.5 148 L59 148 Z
             M53.5 151.5 L53.5 149.5 L56.5 149.5 L56.5 151.5 Z"
          fill="#121212"
        ></path>
        <text
          x="55"
          y="167"
          fill="#7D756D"
          text-anchor="middle"
          data-i18n="error404.homeShort"
          font-size="10.5"
          font-family="Inter,system-ui,sans-serif"
          letter-spacing="0.06em"
        >HOME</text>

        <circle class="pin-ring" cx="685" cy="148" r="9" fill="none" stroke="#D4AF37" stroke-width="1.5"></circle>
        <circle class="pin-ring pin-ring--b" cx="685" cy="148" r="9" fill="none" stroke="#D4AF37" stroke-width="1"></circle>
        <circle cx="685" cy="148" r="8" fill="rgba(212,175,55,0.12)" stroke="#D4AF37" stroke-width="1.8"></circle>
        <text x="685" y="152" fill="#D4AF37" text-anchor="middle" font-size="11" font-weight="800" font-family="Inter,system-ui,sans-serif">?</text>
        <text
          x="685"
          y="167"
          fill="#7D756D"
          text-anchor="middle"
          data-i18n="error404.gate404"
          font-size="10.5"
          font-family="Inter,system-ui,sans-serif"
          letter-spacing="0.06em"
        >GATE 404</text>

        <g id="planeGroup" transform="translate(55,148) rotate(0)">
          <path
            d="M 11,0
               L  2.5,-4.5
               L  4,-2
               L -7,-2
               L -9.5,-6.5
               L -12,-5.5
               L -8.5,-2
               L -12.5,0
               L -8.5,2
               L -12,5.5
               L -9.5,6.5
               L -7,2
               L  4,2
               L  2.5,4.5
               Z"
            fill="#D4AF37"
          ></path>
        </g>
      </svg>
    </div>

    <div class="error-content">
      <div class="boarding-pass" aria-hidden="true">
        <div class="boarding-pass__header">
          <div class="boarding-pass__brand">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"></path>
            </svg>
            Simphonia
          </div>
          <span class="boarding-pass__tag" data-i18n="error404.boardingPass">Boarding Pass</span>
        </div>

        <div class="boarding-pass__route">
          <div class="bp-station">
            <span class="bp-station__code">HOM</span>
            <span class="bp-station__label" data-i18n="error404.origin">Origin</span>
          </div>
          <div class="bp-arrow">
            <div class="bp-arrow-line"></div>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"></path>
            </svg>
            <div class="bp-arrow-line"></div>
          </div>
          <div class="bp-station">
            <span class="bp-station__code" style="color:var(--accent);opacity:0.45;letter-spacing:0.1em;">???</span>
            <span class="bp-station__label" data-i18n="error404.destination">Destination</span>
          </div>
        </div>

        <div class="flip-board" aria-label="Error 404" data-i18n-aria-label="error404.codeAriaLabel">
          <div class="flip-cell" data-target="4"><span>–</span></div>
          <div class="flip-cell" data-target="0"><span>–</span></div>
          <div class="flip-cell" data-target="4"><span>–</span></div>
        </div>

        <div class="boarding-pass__footer">
          <div class="status-dot"></div>
          <span data-i18n="error404.statusNotFound">Status: Destination Not Found</span>
        </div>
      </div>

      <h1 class="error-title" id="error-title-heading" data-i18n="error404.title">Page Not Found</h1>

      <p class="error-desc" data-i18n="error404.desc">
        Looks like this destination isn't on our eSIM network yet. Let's get you back to somewhere familiar.
      </p>

      <div class="error-actions">
        <a href="/" class="btn btn--primary btn--lg" data-i18n="error404.goHome">🏠 Go Home</a>
        <a href="/destinations/" class="btn btn--outline btn--lg" data-i18n="error404.browseDestinations">🌍 Browse Destinations</a>
      </div>
    </div>
  </section>
</div>
