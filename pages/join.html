<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Join Simphonia — Get a Discount on Your First eSIM</title>
  <meta name="description" content="A friend invited you to try Simphonia! Download the app and get a discount on your first eSIM purchase.">
  <meta name="robots" content="noindex, follow">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #121212 0%, #0D0D0D 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #FFFFFF;
    }
    .container { text-align: center; padding: 40px 24px; max-width: 440px; }
    .logo { font-size: 13px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; color: #D4AF37; margin-bottom: 32px; }
    .emoji { font-size: 48px; margin-bottom: 20px; }
    h1 { font-size: 28px; font-weight: 800; letter-spacing: -0.03em; margin-bottom: 12px; line-height: 1.2; }
    .subtitle { font-size: 16px; color: rgba(255,255,255,0.7); line-height: 1.7; margin-bottom: 32px; }
    .code-box {
      display: inline-block;
      background: rgba(212,175,55,0.10);
      border: 1px solid rgba(212,175,55,0.25);
      border-radius: 12px;
      padding: 12px 24px;
      margin-bottom: 32px;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.06em;
      color: #D4AF37;
    }
    .btn {
      display: inline-block;
      background: linear-gradient(135deg, #D4AF37 0%, #C5A028 100%);
      color: #0D0D0D;
      padding: 16px 40px;
      border-radius: 50px;
      text-decoration: none;
      font-weight: 700;
      font-size: 15px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      margin: 8px;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.9; }
    .btn-secondary {
      background: transparent;
      border: 2px solid rgba(255,255,255,0.2);
      color: #FFFFFF;
    }
    .btn-secondary:hover { border-color: rgba(255,255,255,0.4); }
    .store-links { margin-top: 12px; }
    .footer-text { margin-top: 40px; font-size: 12px; color: rgba(255,255,255,0.35); }
  </style>
  <script>
    (function() {
      var params = new URLSearchParams(window.location.search);
      var code = params.get('code') || '';

      // On mobile, try to open the app via custom scheme
      var ua = navigator.userAgent || '';
      var isMobile = /android|iphone|ipad|ipod/i.test(ua);

      if (isMobile && code) {
        window.location.href = 'simphonia://app/join?code=' + encodeURIComponent(code);
      }
    })();
  </script>
</head>
<body>
  <div class="container">
    <div class="logo">Simphonia</div>
    <div class="emoji">🎁</div>
    <h1>You've Been Invited!</h1>
    <p class="subtitle">
      A friend shared their referral code with you. Download the Simphonia app
      and use the code below to get a discount on your first eSIM purchase.
    </p>
    <div class="code-box" id="referral-code"></div>
    <br><br>
    <div class="store-links">
      <a href="https://play.google.com/store/apps/details?id=com.simphonia.app" class="btn">
        Get it on Google Play
      </a>
      <a href="https://apps.apple.com/app/simphonia/id6740088498" class="btn btn-secondary">
        Download on App Store
      </a>
    </div>
    <p class="footer-text">&copy; 2026 Simphonia. All rights reserved.</p>
  </div>
  <script>
    var params = new URLSearchParams(window.location.search);
    var code = params.get('code') || '';
    var el = document.getElementById('referral-code');
    if (code) {
      el.textContent = code;
    } else {
      el.style.display = 'none';
    }
  </script>
</body>
</html>
