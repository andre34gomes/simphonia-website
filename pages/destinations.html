<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
  <title>Destinations — Simphonia eSIM</title>
  <meta name="description" content="Browse eSIM plans for 200+ countries and regions. Find the perfect data plan for your next trip.">
  <meta name="theme-color" content="#121212">
  <link rel="canonical" href="https://simphonia.pt/destinations/">
  <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
  <link rel="shortcut icon" href="../assets/favicon.svg">
  <link rel="mask-icon" href="../assets/favicon.svg" color="#D4AF37">
  <script src="../js/theme-init.js"></script>
  <!-- Open Graph -->
  <meta property="og:title" content="Destinations — Simphonia eSIM">
  <meta property="og:description" content="Browse eSIM plans for 200+ countries and regions. Find the perfect data plan for your next trip.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://simphonia.pt/destinations/">
  <meta property="og:image" content="https://simphonia.pt/assets/og-image.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://simphonia.pt/assets/og-image.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/destinations.css">
</head>
<body>


  <main id="main-content">

    <!-- Hero -->
    <section class="destinations-hero">
      <div class="container">
        <span class="label reveal">Destinations</span>
        <h1 class="reveal">Explore 200+ Countries</h1>
        <p class="reveal">
          Find the perfect eSIM plan for your next trip. Local coverage worldwide.
        </p>

        <div class="search-bar reveal">
          <svg class="search-bar__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>
          </svg>
          <input type="text" class="search-bar__input" id="dest-search" placeholder="Search countries or regions..." aria-label="Search destinations" autocomplete="off">
        </div>

        <div class="filter-tabs reveal">
          <button class="filter-tab filter-tab--active" data-filter="all">All</button>
          <button class="filter-tab" data-filter="popular">Popular</button>
          <button class="filter-tab" data-filter="asia">Asia</button>
          <button class="filter-tab" data-filter="europe">Europe</button>
          <button class="filter-tab" data-filter="americas">Americas</button>
          <button class="filter-tab" data-filter="africa">Africa</button>
          <button class="filter-tab" data-filter="oceania">Oceania</button>
        </div>
      </div>
    </section>

    <!-- Destinations Grid -->
    <section class="section section--no-top">
      <div class="container container--wide">
        <div class="dest-grid" id="dest-grid">
          <!-- Populated by JS -->
        </div>
        <p id="no-results">
          No destinations found. Try a different search term.
        </p>
      </div>
    </section>

    <!-- CTA -->
    <section class="section cta-section">
      <div class="cta-section__bg" aria-hidden="true"></div>
      <div class="container">
        <div class="reveal">
          <h2>Can't Find Your Destination?</h2>
          <p>We're adding new countries every week. Check back soon for more destinations.</p>
          <div class="flex flex-center gap-md mt-xl">
            <a href="support.html" class="btn btn--primary btn--lg">Contact Support</a>
          </div>
        </div>
      </div>
    </section>

  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"
          integrity="sha512-7eHRwcbYkK4d9g/6tD/mhkf++eoTHwpNM9woBxtPUBWm67zeAfFC+HrdoE2GanKeocly/VxeLvIqwvCdk7qScg=="
          crossorigin="anonymous" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"
          integrity="sha512-onMTRKJBKz8M1TnqqDuGBlowlH0ohFzMXYRNebz+yOcc5TQr/zAKsthzhuv0hiyUKEiQEQXEynnXCvNTOk50dg=="
          crossorigin="anonymous" defer></script>
  <script defer src="../js/components/layout.js?v=20260326-10"></script>
  <script defer src="../js/animations.js?v=20260326-10"></script>
  <script defer src="../js/globe.js"></script>
  <script defer src="../js/main.js?v=20260326-10"></script>
  <script type="module" src="../js/destinations.js"></script>

</body>
</html>
