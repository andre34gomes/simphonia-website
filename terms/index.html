      <section class="section section--compact-top">
        <div class="container"><div class="legal-layout"><div class="legal-prose">
          <p>These Terms of Service (&quot;Terms&quot;) govern your use of the Simphonia mobile application, website, and related services (collectively, the &quot;Service&quot;) operated by Simphonia, a company registered in Portugal (&quot;we&quot;, &quot;us&quot;, &quot;our&quot;). By accessing or using the Service, you agree to be bound by these Terms. If you are a consumer in the European Union, these Terms do not affect your statutory rights under applicable EU consumer protection law.</p>
    <h2 id="acceptance">1. Acceptance of Terms</h2><p>By creating an account, making a purchase, or otherwise using the Service, you acknowledge that you have read, understood, and agree to be bound by these Terms and our <a href="/privacy/" rel="noopener noreferrer">Privacy Policy</a>. If you do not agree, do not use the Service.</p><p>You must be at least 16 years of age to use the Service. By using the Service, you represent and warrant that you meet this age requirement.</p>
    <h2 id="description">2. Description of Service</h2><p>Simphonia provides a platform for purchasing and managing eSIM (embedded SIM) data plans for use while traveling internationally. The Service includes:</p><ul><li>Browsing and purchasing eSIM data plans for 200+ countries and regions</li><li>eSIM profile installation, management, and usage monitoring</li><li>Top-up of eligible active eSIM plans</li><li>Account management, profile settings, and order history</li><li>Shopping cart with multi-plan checkout</li><li>Saving favorite destinations for quick access</li><li>Customer support via AI-powered chat assistant and human support agents</li><li>Support ticket system for issue tracking and resolution</li><li>Referral program with discount rewards for inviting friends</li><li>Discount and promotional codes during checkout</li></ul>
    <h2 id="registration">3. Account Registration &amp; Authentication</h2><p>To access certain features of the Service (such as purchasing plans, viewing order history, and using the referral program), you must create an account. You may register using:</p><ul><li>Email address and password</li><li>Google Sign-In</li><li>Facebook Login</li><li>Sign in with Apple</li></ul><p>When using social login, we receive limited profile information (name, email address, and profile photo) from the provider as described in our Privacy Policy.</p><p>You agree to:</p><ul><li>Provide accurate and complete registration information</li><li>Verify your email address when requested</li><li>Maintain the security of your account credentials</li><li>Notify us immediately of any unauthorized access to your account</li><li>Accept responsibility for all activities that occur under your account</li></ul><h3>3.1 Guest Access</h3><p>You may browse eSIM plans and interact with the AI chat assistant without creating an account. However, purchasing plans, viewing order history, accessing the referral program, and using other authenticated features requires a registered account.</p>
    <h2 id="purchases">4. Purchases &amp; Payments</h2><h3>4.1 Pricing &amp; Currency</h3><p>All prices are displayed in the currency you select within the app. Simphonia supports multiple currencies including USD, EUR, GBP, JPY, AUD, CAD, CHF, CNY, SEK, NZD, and BRL. Prices may vary based on destination, data amount, validity period, and the selected currency. The final price is confirmed at checkout before payment.</p><h3>4.2 Payment Processing</h3><p>Payments are processed securely through Stripe, a PCI-DSS Level 1 certified payment processor. We accept all major credit and debit cards, as well as Apple Pay and Google Pay where available. We do not store your full payment card details on our servers — all payment data is handled directly by Stripe.</p><h3>4.3 Discount &amp; Promotional Codes</h3><p>Discount codes and promotional offers may be applied at checkout. Discount codes are subject to availability, validity periods, and usage limits. We reserve the right to modify or withdraw promotional offers at any time. Discount codes cannot be combined unless explicitly stated.</p><h3>4.4 Referral Program</h3><p>Registered users may participate in our referral program by sharing their unique referral code. When a referred user makes their first purchase, both the referrer and the referred user may receive a discount reward, subject to the current referral program terms. Referral rewards are issued as discount codes and cannot be exchanged for cash. We reserve the right to modify, suspend, or terminate the referral program at any time.</p><h3>4.5 Refund Policy</h3><p>Refunds are available under the following conditions:</p><ul><li>Unused eSIM: Full refund within 30 days of purchase if the eSIM has not been installed or activated</li><li>Technical issues: If we are unable to deliver a working eSIM profile, you are entitled to a full refund or replacement at no additional cost</li><li>Used eSIM: Once data has been consumed, refunds are evaluated on a case-by-case basis</li><li>EU consumers: If you are a consumer in the European Union, you have the right to withdraw from a purchase within 14 days. However, by purchasing and using a digital eSIM that is delivered immediately, you acknowledge and agree that you lose the right of withdrawal once the eSIM profile has been delivered and provisioned</li></ul><p>To request a refund, contact our support team through the app or at support@simphonia.pt.</p><h3>4.6 Order Confirmation</h3><p>After a successful purchase, you will receive an order confirmation via email. Your eSIM profile(s) will be available in the app under your purchase history and eSIM management section.</p>
    <h2 id="esim-terms">5. eSIM Service Terms</h2><h3>5.1 Device Compatibility</h3><p>It is your responsibility to ensure your device is eSIM-compatible and carrier-unlocked before purchasing. Simphonia is not liable for purchases made for incompatible devices. You can check device compatibility information in our FAQ section or by contacting support.</p><h3>5.2 eSIM Delivery &amp; Installation</h3><p>eSIM profiles are delivered digitally and are typically available within minutes of a successful purchase. Installation is performed via a QR code or manual activation code provided in the app. Each eSIM profile can only be installed on one device and cannot be transferred to another device once installed.</p><h3>5.3 Activation &amp; Validity</h3><p>Depending on the plan, an eSIM may activate upon first data use or upon installation. The validity period begins at the time of activation. Once expired, any remaining unused data is forfeited and cannot be recovered or refunded.</p><h3>5.4 Top-Up</h3><p>Certain active eSIM plans may be eligible for top-up, allowing you to purchase additional data. Top-up availability depends on the plan and the eSIM provider. Top-up purchases are non-refundable once the additional data has been applied.</p><h3>5.5 Service Availability &amp; Coverage</h3><p>While we strive for reliable coverage, mobile data service is dependent on local network operators and may be affected by network congestion, maintenance, weather, geographic factors, or other circumstances outside our control. Coverage and speeds are not guaranteed.</p><h3>5.6 Fair Usage</h3><p>All plans are subject to fair usage policies. Plans are intended for personal, non-commercial use and may not be resold, redistributed, or used for commercial purposes. We reserve the right to suspend service for accounts that violate fair usage policies.</p>
    <h2 id="ai-chat">6. AI Chat Assistant</h2><p>The Service includes an AI-powered chat assistant designed to help you find suitable eSIM plans, answer frequently asked questions, and provide general support. The AI assistant is powered by third-party large language model providers (currently OpenAI and Google Gemini).</p><p>Please be aware that:</p><ul><li>AI responses are generated automatically and may not always be accurate or complete</li><li>The AI assistant should not be relied upon for critical decisions — for complex issues, please contact our human support team</li><li>Chat conversations may be reviewed to improve service quality</li><li>Do not share sensitive personal information (such as passwords or full payment details) in the chat</li><li>The AI assistant can perform certain actions on your behalf (such as adding items to your cart) when you explicitly request it</li></ul>
    <h2 id="communications">7. Communications &amp; Marketing</h2><p>By using the Service, you agree to receive transactional communications related to your account and purchases, including:</p><ul><li>Welcome email upon registration</li><li>Email verification upon registration</li><li>Order confirmation emails</li><li>Password reset emails</li><li>Support ticket reply notifications</li><li>Referral reward notifications</li></ul><p>You may also opt in to receive marketing emails about promotions, new features, and travel tips. Marketing emails are optional and you can opt out at any time through your profile settings in the app or by using the unsubscribe link in any marketing email. Opting out of marketing emails does not affect transactional communications.</p>
    <h2 id="ip">8. Intellectual Property</h2><p>The Service, including its design, logos, brand name, text, graphics, user interface, software, and underlying technology, is owned by Simphonia and protected by Portuguese, European Union, and international intellectual property laws. You may not reproduce, modify, distribute, reverse engineer, or create derivative works based on any part of the Service without our prior written consent.</p>
    <h2 id="prohibited">9. Prohibited Uses</h2><p>You agree not to:</p><ul><li>Use the Service for any unlawful purpose or in violation of any applicable local, national, or international law</li><li>Attempt to interfere with, disrupt, or compromise the security or integrity of the Service</li><li>Reverse engineer, decompile, disassemble, or otherwise attempt to derive the source code of the Service</li><li>Use automated systems, bots, scrapers, or similar tools to access the Service without our express permission</li><li>Impersonate another person, entity, or misrepresent your affiliation with any person or entity</li><li>Resell, commercially redistribute, or sublicense eSIM plans or any part of the Service</li><li>Abuse the referral program or discount system (e.g., self-referrals, creating multiple accounts to obtain additional rewards)</li><li>Share, transfer, or sell your account credentials to any third party</li><li>Circumvent or attempt to circumvent any security measures, rate limits, or access controls</li></ul>
    <h2 id="liability">10. Limitation of Liability</h2><p>To the maximum extent permitted by applicable law, Simphonia shall not be liable for any indirect, incidental, special, consequential, or punitive damages arising from or related to your use of the Service, including but not limited to loss of data, loss of profits, or service interruptions.</p><p>Our total aggregate liability for any claims arising from the Service shall not exceed the amount you have paid to Simphonia in the twelve (12) months preceding the event giving rise to the claim.</p><p>Nothing in these Terms excludes or limits our liability for death or personal injury caused by negligence, fraud or fraudulent misrepresentation, or any other liability that cannot be excluded or limited under applicable law.</p>
    <h2 id="warranties">11. Disclaimer of Warranties</h2><p>The Service is provided &quot;as is&quot; and &quot;as available&quot; without warranties of any kind, whether express or implied, including but not limited to implied warranties of merchantability, fitness for a particular purpose, and non-infringement.</p><p>We do not warrant that the Service will be uninterrupted, error-free, secure, or free of harmful components. We do not warrant the accuracy, reliability, or completeness of any content provided through the Service, including AI-generated responses.</p>
    <h2 id="modifications">12. Modifications to Terms</h2><p>We may update these Terms from time to time to reflect changes in our Service, legal requirements, or business practices. We will notify you of material changes by updating the &quot;Last updated&quot; date and, where appropriate, by sending you an email notification. Continued use of the Service after changes take effect constitutes acceptance of the revised Terms. If you do not agree with the updated Terms, you should stop using the Service and delete your account.</p>
    <h2 id="termination">13. Termination &amp; Account Deletion</h2><p>We may suspend or terminate your account at our discretion if you violate these Terms or engage in prohibited activities. In the event of termination for cause, any unused eSIM plans may be forfeited.</p><p>You may delete your account at any time through the Profile Settings page in the app. Account deletion is permanent and will result in:</p><ul><li>Removal of your personal data from our active systems (subject to legal retention obligations)</li><li>Loss of access to any purchased but unused eSIM plans</li><li>Cancellation of any unredeemed referral rewards</li><li>Deletion of your order history, favorites, and preferences</li></ul><p>You may also request account deletion by contacting support@simphonia.pt.</p>
    <h2 id="governing-law">14. Governing Law &amp; Dispute Resolution</h2><p>These Terms are governed by and construed in accordance with the laws of Portugal, without regard to conflict of law provisions.</p><p>If you are a consumer residing in the European Union, you also benefit from any mandatory provisions of the consumer protection law of your country of residence. Nothing in these Terms affects your rights as a consumer under applicable EU law.</p><p>For EU consumers, you may also submit disputes to the European Commission&#39;s Online Dispute Resolution platform at <a href="https://ec.europa.eu/consumers/odr" rel="noopener noreferrer">https://ec.europa.eu/consumers/odr</a>.</p><p>Any disputes not resolved amicably shall be submitted to the exclusive jurisdiction of the courts of Lisbon, Portugal, subject to any mandatory consumer protection jurisdiction rules applicable to you.</p>
    <h2 id="severability">15. Severability</h2><p>If any provision of these Terms is found to be invalid, illegal, or unenforceable by a court of competent jurisdiction, that provision shall be modified to the minimum extent necessary to make it enforceable, or if modification is not possible, severed. The remaining provisions shall continue in full force and effect.</p>
