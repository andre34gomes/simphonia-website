<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found — Simphonia eSIM</title>
  <meta name="description" content="The page you're looking for doesn't exist. Let's get you back on track.">
  <meta name="theme-color" content="#121212">
  <meta name="robots" content="noindex, follow">
  <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg">
  <link rel="shortcut icon" href="./assets/favicon.svg">
  <link rel="mask-icon" href="./assets/favicon.svg" color="#D4AF37">
  <script>!function(){var t;try{t=localStorage.getItem("simphonia-theme")}catch(e){}if(!t)t=matchMedia("(prefers-color-scheme:light)").matches?"light":"dark";document.documentElement.dataset.theme=t;if(t==="light"){var m=document.querySelector("meta[name=theme-color]");if(m)m.content="#FFF5F1"}}()</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/home.css">
  <style>
    /* ── 404 Page ── */
    .error-section {
      min-height: calc(100vh - var(--nav-height));
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: var(--space-4xl) var(--space-xl);
      position: relative;
      overflow: hidden;
    }

    /* Ambient glow orbs */
    .error-section__orb {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
    }

    .error-section > .container {
      position: relative;
      z-index: 1;
      max-width: 560px;
    }

    .error-code {
      font-size: clamp(6rem, 20vw, 12rem);
      font-weight: 800;
      line-height: 1;
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-light) 50%, var(--accent-dark) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -0.04em;
      animation: error-float 4s ease-in-out infinite;
      display: block;
      margin-bottom: var(--space-lg);
    }

    @keyframes error-float {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(-12px); }
    }

    .error-title {
      font-size: clamp(1.5rem, 4vw, 2rem);
      font-weight: 700;
      margin-bottom: var(--space-md);
      color: var(--text-primary);
    }

    .error-desc {
      font-size: 1.0625rem;
      color: var(--text-secondary);
      line-height: 1.7;
      margin-bottom: var(--space-2xl);
    }

    .error-actions {
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-md);
      justify-content: center;
    }

    .error-links {
      margin-top: var(--space-2xl);
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-sm) var(--space-xl);
      justify-content: center;
      padding-top: var(--space-2xl);
      border-top: 1px solid var(--border-subtle);
    }

    .error-links a {
      color: var(--text-tertiary);
      font-size: 0.875rem;
      transition: color 0.3s ease;
    }

    .error-links a:hover {
      color: var(--accent);
    }

    @media (max-width: 480px) {
      .error-actions {
        flex-direction: column;
        align-items: stretch;
      }
      .error-actions .btn {
        text-align: center;
      }
    }
  </style>
</head>
<body>

  <main id="main-content">

    <section class="error-section">
      <!-- Glow orbs -->
      <div class="error-section__orb" style="width:600px;height:600px;background:rgba(212,175,55,0.08);top:-15%;left:-15%;filter:blur(140px);"></div>
      <div class="error-section__orb" style="width:450px;height:450px;background:rgba(80,50,200,0.05);bottom:-10%;right:-10%;filter:blur(120px);"></div>
      <div class="error-section__orb" style="width:300px;height:300px;background:rgba(212,175,55,0.05);top:30%;left:50%;transform:translateX(-50%);filter:blur(100px);"></div>

      <div class="container">
        <span class="error-code" aria-hidden="true">404</span>
        <h1 class="error-title">Page Not Found</h1>
        <p class="error-desc">
          Looks like this destination isn't on our eSIM network yet.<br>
          Let's get you back to somewhere familiar.
        </p>

        <div class="error-actions">
          <a href="./" class="btn btn--primary btn--lg">Go Home</a>
          <a href="./destinations/" class="btn btn--ghost btn--lg">Browse Destinations</a>
        </div>

        <nav class="error-links" aria-label="Quick links">
          <a href="./how-it-works/">How It Works</a>
          <a href="./support/">Support</a>
          <a href="./about/">About</a>
        </nav>
      </div>
    </section>

  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js" defer></script>
  <script defer src="./js/components/layout.js?v=20260325-1"></script>
  <script defer src="./js/animations.js"></script>
  <script defer src="./js/main.js?v=20260325-1"></script>

</body>
</html>
