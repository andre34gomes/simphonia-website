<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Page Not Found — Simphonia eSIM</title>
  <meta name="description" content="The page you're looking for doesn't exist. Let's get you back on track.">
  <meta name="theme-color" content="#121212">
  <meta name="robots" content="noindex, follow">
  <!-- CSP: mirrors index.html policy for consistency -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com;
    style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
    font-src 'self' https://fonts.gstatic.com;
    img-src 'self' data: https:;
    connect-src 'self' https://api.simphonia.pt http://localhost:*;
    upgrade-insecure-requests;
  ">
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <link rel="shortcut icon" href="/assets/favicon.svg">
  <link rel="mask-icon" href="/assets/favicon.svg" color="#D4AF37">
  <script src="/js/theme-init.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Async font loading — non-blocking, matches index.html pattern -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Pacifico&display=optional"
        media="print" onload="this.media='all'">
  <noscript>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Pacifico&display=optional">
  </noscript>

  <!-- Critical inline CSS for instant first paint -->
  <style>
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
    :root{--accent:#D4AF37;--bg-primary:#121212;--text-primary:#FFFFFF;--font-body:'Inter',system-ui,-apple-system,sans-serif;--nav-height:72px}
    [data-theme="light"]{--bg-primary:#FEF9EE;--text-primary:#1C1814}
    @media(prefers-color-scheme:light){html:not([data-theme]){--bg-primary:#FEF9EE;--text-primary:#1C1814}}
    html{-webkit-text-size-adjust:100%}
    body{background-color:var(--bg-primary);color:var(--text-primary);font-family:var(--font-body);font-size:16px;line-height:1.6;overflow-x:clip;-webkit-font-smoothing:antialiased}
    a{text-decoration:none;color:inherit}
  </style>

  <!-- Full stylesheet: render-blocking to prevent flash of unstyled content -->
  <link rel="stylesheet" href="/css/base.css">
  <style>
    /* ── 404 Page ── */
    .error-section {
      min-height: calc(100vh - var(--nav-height));
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: var(--space-4xl) var(--space-xl);
      position: relative;
      overflow: hidden;
    }

    /* Ambient glow orbs */
    .error-section__orb {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
    }

    .error-section > .container {
      position: relative;
      z-index: 1;
      max-width: 560px;
    }

    .error-code {
      font-size: clamp(6rem, 20vw, 12rem);
      font-weight: 800;
      line-height: 1;
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-light) 50%, var(--accent-dark) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -0.04em;
      animation: error-float 4s ease-in-out infinite;
      display: block;
      margin-bottom: var(--space-lg);
    }

    @keyframes error-float {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(-12px); }
    }

    .error-title {
      font-size: clamp(1.5rem, 4vw, 2rem);
      font-weight: 700;
      margin-bottom: var(--space-md);
      color: var(--text-primary);
    }

    .error-desc {
      font-size: 1.0625rem;
      color: var(--text-secondary);
      line-height: 1.7;
      margin-bottom: var(--space-2xl);
    }

    .error-actions {
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-md);
      justify-content: center;
    }

    .error-links {
      margin-top: var(--space-2xl);
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-sm) var(--space-xl);
      justify-content: center;
      padding-top: var(--space-2xl);
      border-top: 1px solid var(--border-subtle);
    }

    .error-links a {
      color: var(--text-tertiary);
      font-size: 0.875rem;
      transition: color 0.3s ease;
    }

    .error-links a:hover {
      color: var(--accent);
    }

    @media (max-width: 480px) {
      .error-actions {
        flex-direction: column;
        align-items: stretch;
      }
      .error-actions .btn {
        text-align: center;
      }
    }
  </style>
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <main id="main-content">

    <section class="error-section" aria-labelledby="error-title-heading">
      <!-- Glow orbs -->
      <div class="error-section__orb" style="width:600px;height:600px;background:rgba(212,175,55,0.08);top:-15%;left:-15%;filter:blur(140px);"></div>
      <div class="error-section__orb" style="width:450px;height:450px;background:rgba(80,50,200,0.05);bottom:-10%;right:-10%;filter:blur(120px);"></div>
      <div class="error-section__orb" style="width:300px;height:300px;background:rgba(212,175,55,0.05);top:30%;left:50%;transform:translateX(-50%);filter:blur(100px);"></div>

      <div class="container">
        <span class="error-code" aria-hidden="true">404</span>
        <h1 class="error-title" id="error-title-heading">Page Not Found</h1>
        <p class="error-desc">
          Looks like this destination isn't on our eSIM network yet.<br>
          Let's get you back to somewhere familiar.
        </p>

        <div class="error-actions">
          <a href="/" class="btn btn--primary btn--lg">Go Home</a>
          <a href="/destinations/" class="btn btn--ghost btn--lg">Browse Destinations</a>
          <button class="btn btn--ghost btn--lg" id="copy-404-link" aria-label="Copy this page URL to clipboard">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
            <span id="copy-404-label">Copy Link</span>
          </button>
        </div>

        <nav class="error-links" aria-label="Quick links">
          <a href="/how-it-works/">How It Works</a>
          <a href="/support/">Support</a>
          <a href="/about/">About</a>
        </nav>
      </div>
    </section>

  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"
          integrity="sha512-7eHRwcbYkK4d9g/6tD/mhkf++eoTHwpNM9woBxtPUBWm67zeAfFC+HrdoE2GanKeocly/VxeLvIqwvCdk7qScg=="
          crossorigin="anonymous" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"
          integrity="sha512-onMTRKJBKz8M1TnqqDuGBlowlH0ohFzMXYRNebz+yOcc5TQr/zAKsthzhuv0hiyUKEiQEQXEynnXCvNTOk50dg=="
          crossorigin="anonymous" defer></script>
  <script defer src="/js/cdn-fallback.js"></script>
  <script defer src="/js/components/layout.js?v=20260401"></script>
  <script defer src="/js/auth.js?v=20260401"></script>
  <script defer src="/js/animations-core.js?v=20260401"></script>
  <script defer src="/js/animations-subpages.js?v=20260401"></script>
  <script defer src="/js/main.js?v=20260401"></script>
  <script>if('serviceWorker'in navigator)window.addEventListener('load',function(){navigator.serviceWorker.register('/sw.js').catch(function(){})});</script>
  <!-- Copy-link button for reporting broken URLs -->
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      var btn = document.getElementById('copy-404-link');
      var label = document.getElementById('copy-404-label');
      if (!btn || !label) return;
      btn.addEventListener('click', function () {
        var url = window.location.href;
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(url).then(function () {
            label.textContent = 'Copied!';
            setTimeout(function () { label.textContent = 'Copy Link'; }, 2000);
          }).catch(function () {
            label.textContent = 'Failed';
            setTimeout(function () { label.textContent = 'Copy Link'; }, 2000);
          });
        } else {
          /* Fallback for older browsers */
          var ta = document.createElement('textarea');
          ta.value = url;
          ta.style.position = 'fixed';
          ta.style.opacity = '0';
          document.body.appendChild(ta);
          ta.select();
          try { document.execCommand('copy'); label.textContent = 'Copied!'; }
          catch (_) { label.textContent = 'Failed'; }
          document.body.removeChild(ta);
          setTimeout(function () { label.textContent = 'Copy Link'; }, 2000);
        }
      });
    });
  </script>

</body>
</html>
