<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="12" y1="8" x2="118" y2="122" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#151720"/>
      <stop offset="55%" stop-color="#0B0C12"/>
      <stop offset="100%" stop-color="#06070B"/>
    </linearGradient>
    <clipPath id="globe">
      <circle cx="64" cy="64" r="44"/>
    </clipPath>
  </defs>

  <rect width="128" height="128" rx="28" fill="url(#bg)"/>

  <!-- Globe ring — slightly bolder for small sizes -->
  <circle cx="64" cy="64" r="44" stroke="#D4AF37" stroke-opacity="0.25" stroke-width="2.5" fill="none"/>

  <!-- Harmonic waves — bold solid strokes for favicon clarity -->
  <g clip-path="url(#globe)">
    <path d="M 14 42 Q 30 22, 46 42 Q 64 62, 82 42 Q 98 22, 114 42"
      stroke="#F8E9A0" stroke-width="5" stroke-linecap="round" fill="none"/>
    <path d="M 14 64 Q 30 40, 46 64 Q 64 88, 82 64 Q 98 40, 114 64"
      stroke="#D4AF37" stroke-width="9" stroke-linecap="round" fill="none"/>
    <path d="M 14 86 Q 30 66, 46 86 Q 64 106, 82 86 Q 98 66, 114 86"
      stroke="#B8941F" stroke-width="5" stroke-linecap="round" fill="none"/>
  </g>

  <rect x="1.5" y="1.5" width="125" height="125" rx="26.5" stroke="#D4AF37" stroke-opacity="0.22" stroke-width="1.5" fill="none"/>
</svg>